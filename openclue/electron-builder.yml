appId: dev.openclue.app
productName: OpenClue
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OpenClue uses the microphone only while you have started a recording, to transcribe your speech. A red recording indicator is always shown.
    NSScreenCaptureUsageDescription: OpenClue captures a screenshot only when you ask a question with screen access enabled, so the AI can see what you are looking at.
    LSUIElement: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage]
  category: Utility
win:
  target: [nsis]
npmRebuild: false
publish: null
