name: OpenClue

on:
  push:
    paths: ['openclue/**', '.github/workflows/openclue.yml']
  pull_request:
    paths: ['openclue/**', '.github/workflows/openclue.yml']

defaults:
  run:
    working-directory: openclue

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openclue/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end smoke test
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e

  package-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openclue/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package unsigned app
        run: npx electron-builder --mac zip --arm64 -c.mac.identity=null
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClue-mac-arm64
          path: openclue/dist/*.zip
